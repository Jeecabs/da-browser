<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" role="img" aria-labelledby="title description">
<title id="title">One browser, a whole team</title>
<desc id="description">One pi session and three Claude Code sessions work in parallel in your signed-in Arc browser. Each session connects to its own pinned tab: pi tests sign-up, while Claude Code sessions review the UI, check accessibility and research an API. pi has a blue pointer favicon and blue page glow. Claude Code has coral pointer-and-sparkle favicons. Your Gmail, Figma, Linear and Docs tabs stay yours.</desc>
<defs>
<linearGradient id="glow-top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#428fe8" stop-opacity=".48"/><stop offset="1" stop-color="#428fe8" stop-opacity="0"/></linearGradient>
<linearGradient id="glow-left" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#428fe8" stop-opacity=".32"/><stop offset="1" stop-color="#428fe8" stop-opacity="0"/></linearGradient>
<linearGradient id="glow-right" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#428fe8" stop-opacity=".32"/><stop offset="1" stop-color="#428fe8" stop-opacity="0"/></linearGradient>
<linearGradient id="glow-bottom" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#428fe8" stop-opacity=".22"/><stop offset="1" stop-color="#428fe8" stop-opacity="0"/></linearGradient>
<clipPath id="page-clip"><rect x="626" y="244" width="526" height="460" rx="12"/></clipPath>
<image id="pi-favicon" href="data:image/png;base64," width="32" height="32"/>
<image id="claude-favicon" href="data:image/png;base64," width="32" height="32"/>
</defs>
<style>
svg { --ink:#222b38; --muted:#647184; --line:#dce3ec; --chrome:#f3f6fa; --surface:#fff; --field:#f7f9fc; --blue:#428fe8; --blue-ink:#286ebd; --blue-wash:#eaf3ff; --coral:#ef5c50; --coral-wash:#fff0ed; --button:#222b38; --button-text:#fff; }
@media (prefers-color-scheme: dark) {
 svg { --ink:#edf2f9; --muted:#a3afc0; --line:#303e50; --chrome:#17202c; --surface:#0f1722; --field:#1b2635; --blue-ink:#89c1ff; --blue-wash:#203650; --coral-wash:#382928; --button:#edf2f9; --button-text:#0f1722; }
}
text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; fill:var(--ink); }
.headline { font-size:44px; font-weight:750; letter-spacing:-1.8px; }
.intro { font-size:20px; fill:var(--muted); }
.section { font-size:16px; font-weight:650; fill:var(--muted); }
.pitch { font-size:27px; font-weight:650; letter-spacing:-.7px; }
.caption { font-size:16px; fill:var(--muted); }
.browser { fill:var(--chrome); stroke:var(--line); stroke-width:1.5; }
.surface { fill:var(--surface); }
.line { stroke:var(--line); stroke-width:1; }
.user-tab { font-size:18px; fill:var(--muted); }
.user-favicon { fill:var(--line); }
.user-letter { font-size:12px; font-weight:650; fill:var(--muted); }
.session { fill:var(--surface); }
.session-name { font-size:18px; font-weight:650; }
.task { font-size:16px; fill:var(--muted); }
.pi-tab { fill:var(--blue-wash); stroke:var(--blue); stroke-width:1.5; }
.claude-tab { fill:var(--coral-wash); }
.tab-title { font-size:18px; font-weight:600; }
.tab-address { font-size:12px; fill:var(--muted); }
.connector { fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.blue { stroke:var(--blue); }
.coral { stroke:var(--coral); }
.url { font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:14px; fill:var(--muted); }
.app-name { font-size:17px; font-weight:650; }
.app-nav { font-size:14px; fill:var(--muted); }
.app-title { font-size:29px; font-weight:700; letter-spacing:-.7px; }
.field-label { font-size:15px; font-weight:550; }
.field { fill:var(--field); stroke:var(--line); }
.field-value { font-size:16px; }
.button { fill:var(--button); }
.button-text { font-size:16px; font-weight:600; fill:var(--button-text); }
.activity { font-size:14px; fill:var(--blue-ink); }
.cursor { fill:var(--ink); stroke:var(--surface); stroke-width:1.6; stroke-linejoin:round; }
</style>
<text class="headline" x="32" y="78">One browser, a whole team</text>
<text class="intro" x="32" y="119">Run pi and multiple Claude Code sessions in parallel, each in its own tab.</text>
<text class="pitch" x="32" y="249">Give each session</text>
<text class="pitch" x="32" y="282">a job of its own.</text>
<text class="caption" x="32" y="321">They work side by side.</text>
<text class="section" x="32" y="356">Working in parallel</text>
<text class="section" x="338" y="169">Your signed-in browser</text>
<rect class="browser" x="338" y="188" width="830" height="532" rx="18"/>
<circle cx="360" cy="211" r="4.5" fill="var(--line)"/><circle cx="376" cy="211" r="4.5" fill="var(--line)"/><circle cx="392" cy="211" r="4.5" fill="var(--line)"/>
<text class="caption" x="412" y="217">Arc</text>
<rect class="surface" x="626" y="198" width="526" height="28" rx="7"/>
<path d="M640 208h10m-6-4-4 4 4 4" class="connector" stroke="var(--muted)" stroke-width="1.5"/>
<text class="url" x="666" y="217">localhost:3000/signup</text>
<line class="line" x1="338" y1="235" x2="1168" y2="235"/>
<line class="line" x1="614" y1="244" x2="614" y2="704"/>
<text class="section" x="362" y="256">Your tabs</text>
<rect class="user-favicon" x="368" y="271" width="22" height="22" rx="6"/>
<text class="user-letter" x="379" y="286.5" text-anchor="middle">G</text>
<text class="user-tab" x="402" y="289">Gmail</text>
<rect class="user-favicon" x="368" y="313" width="22" height="22" rx="6"/>
<text class="user-letter" x="379" y="328.5" text-anchor="middle">F</text>
<text class="user-tab" x="402" y="331">Figma</text>
<rect class="user-favicon" x="368" y="633" width="22" height="22" rx="6"/>
<text class="user-letter" x="379" y="648.5" text-anchor="middle">L</text>
<text class="user-tab" x="402" y="651">Linear</text>
<rect class="user-favicon" x="368" y="675" width="22" height="22" rx="6"/>
<text class="user-letter" x="379" y="690.5" text-anchor="middle">D</text>
<text class="user-tab" x="402" y="693">Docs</text>
<text class="section" x="362" y="363">Agent tabs</text>
<rect class="session" x="32" y="374" width="266" height="52" rx="9"/>
<path class="connector blue" d="M33 384v32" stroke-width="3"/>
<use href="#pi-favicon" x="48" y="384"/>
<text class="session-name" x="92" y="395">pi</text>
<text class="task" x="92" y="417">Test the sign-up flow</text>
<path class="connector blue" d="M306 400h42m-7-5 7 5-7 5"/>
<rect class="pi-tab" x="354" y="374" width="250" height="52" rx="9"/>
<use href="#pi-favicon" transform="translate(366 388) scale(.75)"/>
<text class="tab-title" x="402" y="396">Sign-up test</text>
<text class="tab-address" x="402" y="415">localhost:3000/signup</text>
<rect class="session" x="32" y="434" width="266" height="52" rx="9"/>
<path class="connector coral" d="M33 444v32" stroke-width="3"/>
<use href="#claude-favicon" x="48" y="444"/>
<text class="session-name" x="92" y="455">Claude Code 1</text>
<text class="task" x="92" y="477">Review the UI</text>
<path class="connector coral" d="M306 460h42m-7-5 7 5-7 5"/>
<rect class="claude-tab" x="354" y="434" width="250" height="52" rx="9"/>
<use href="#claude-favicon" transform="translate(366 448) scale(.75)"/>
<text class="tab-title" x="402" y="456">UI review</text>
<text class="tab-address" x="402" y="475">localhost:3000/preview</text>
<rect class="session" x="32" y="494" width="266" height="52" rx="9"/>
<path class="connector coral" d="M33 504v32" stroke-width="3"/>
<use href="#claude-favicon" x="48" y="504"/>
<text class="session-name" x="92" y="515">Claude Code 2</text>
<text class="task" x="92" y="537">Check accessibility</text>
<path class="connector coral" d="M306 520h42m-7-5 7 5-7 5"/>
<rect class="claude-tab" x="354" y="494" width="250" height="52" rx="9"/>
<use href="#claude-favicon" transform="translate(366 508) scale(.75)"/>
<text class="tab-title" x="402" y="516">Accessibility</text>
<text class="tab-address" x="402" y="535">localhost:3000/pricing</text>
<rect class="session" x="32" y="554" width="266" height="52" rx="9"/>
<path class="connector coral" d="M33 564v32" stroke-width="3"/>
<use href="#claude-favicon" x="48" y="564"/>
<text class="session-name" x="92" y="575">Claude Code 3</text>
<text class="task" x="92" y="597">Research the API</text>
<path class="connector coral" d="M306 580h42m-7-5 7 5-7 5"/>
<rect class="claude-tab" x="354" y="554" width="250" height="52" rx="9"/>
<use href="#claude-favicon" transform="translate(366 568) scale(.75)"/>
<text class="tab-title" x="402" y="576">API docs</text>
<text class="tab-address" x="402" y="595">docs.example.com</text>
<g clip-path="url(#page-clip)">
<rect class="surface" x="626" y="244" width="526" height="460" rx="12"/>
<rect x="626" y="244" width="526" height="22" fill="url(#glow-top)"/>
<rect x="626" y="244" width="12" height="460" fill="url(#glow-left)"/>
<rect x="1140" y="244" width="12" height="460" fill="url(#glow-right)"/>
<rect x="626" y="692" width="526" height="12" fill="url(#glow-bottom)"/>
</g>
<rect x="626" y="244" width="526" height="460" rx="12" fill="none" stroke="var(--blue)" stroke-opacity=".45" stroke-width="1.5"/>
<text class="app-name" x="652" y="280">Your app</text>
<text class="app-nav" x="1126" y="280" text-anchor="end">Sign in</text>
<line class="line" x1="652" y1="298" x2="1126" y2="298"/>
<text class="app-title" x="680" y="348">Create your account</text>
<text class="caption" x="680" y="375">Set up your workspace.</text>
<text class="field-label" x="680" y="409">Name</text>
<rect class="field" x="680" y="420" width="422" height="44" rx="7"/>
<text class="field-value" x="696" y="448">Alex</text>
<text class="field-label" x="680" y="495">Email</text>
<rect class="field" x="680" y="506" width="422" height="44" rx="7"/>
<text class="field-value" x="696" y="534">alex@example.test</text>
<rect class="button" x="680" y="577" width="422" height="46" rx="8"/>
<text class="button-text" x="891" y="606" text-anchor="middle">Create account</text>
<path class="connector blue" d="M651 480 C634 556 645 614 713 604" stroke-opacity=".65"/>
<path class="cursor" d="M716 594v22l5.5-5.2 4 8.8 3.4-1.6-3.9-8.6 7.8-.3z"/>
<use href="#pi-favicon" transform="translate(680 662) scale(.625)"/>
<text class="activity" x="710" y="678">pi is testing the sign-up flow</text>
<text class="caption" x="338" y="752">Your agents work in their own tabs while you keep using yours.</text>
</svg>
