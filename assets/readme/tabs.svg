<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" role="img" aria-labelledby="t d">
<title id="t">One browser, many independent sessions</title>
<desc id="d">Your signed-in Arc with eight tabs. One pi session and three Claude Code sessions each drive a separate pinned tab, marked in coral with the agent's favicon. Your Gmail, Linear, Figma and Docs tabs are left alone. Claude Code session 1 checks a local app preview, with a coral edge glow and a curved pointer path to the Open preview button.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker>
<linearGradient id="glow-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef5c50" stop-opacity=".6"/><stop offset="1" stop-color="#ef5c50" stop-opacity="0"/></linearGradient>
<linearGradient id="glow-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef5c50" stop-opacity=".4"/><stop offset="1" stop-color="#ef5c50" stop-opacity="0"/></linearGradient>
<linearGradient id="glow-right" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ef5c50" stop-opacity=".4"/><stop offset="1" stop-color="#ef5c50" stop-opacity="0"/></linearGradient>
<clipPath id="page"><rect x="520" y="84" width="336" height="414" rx="10"/></clipPath>
<image id="pi-favicon" href="data:image/png;base64," width="24" height="24"/>
<image id="claude-favicon" href="data:image/png;base64," width="24" height="24"/>
</defs>
<style>
svg { --window:#ffffff; --side:#f6f8fa; --row:#ffffff; --line:#d1d9e0; --text:#1f2328; --muted:#59636e; --skel:#e6eaef; --page:#ffffff; --button:#1f2328; --button-text:#ffffff; }
@media (prefers-color-scheme: dark) {
  svg { --window:#0d1117; --side:#151b23; --row:#0d1117; --line:#3d444d; --text:#e6edf3; --muted:#9198a1; --skel:#262c36; --page:#0d1117; --button:#e6edf3; --button-text:#0d1117; }
}
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
.window { fill: var(--side); stroke: var(--line); }
.row { fill: var(--row); stroke: var(--line); }
.agent-row { fill: #ef5c50; fill-opacity: .12; stroke: #ef5c50; stroke-opacity: .7; stroke-width: 1.5; }
.active-row { stroke-opacity: 1; stroke-width: 2; }
.fav { fill: var(--skel); }
.fav-letter { fill: var(--muted); font-size: 11px; font-weight: 600; }
.tab { fill: var(--muted); font-size: 14px; }
.tab-agent { fill: var(--text); font-size: 14px; font-weight: 600; }
.agent { fill: var(--window); stroke: #ef5c50; stroke-width: 1.5; }
.agent-name { fill: var(--text); font-size: 15px; font-weight: 650; }
.agent-sub { fill: var(--muted); font-size: 12px; }
.link { fill: none; stroke: #ef5c50; stroke-width: 2; }
.arrow { fill: #ef5c50; }
.caption { fill: var(--muted); font-size: 12.5px; }
.dot { fill: var(--line); }
.page { fill: var(--page); stroke: var(--line); }
.page-title { fill: var(--text); font-size: 19px; font-weight: 650; }
.skel { fill: var(--skel); }
.button { fill: var(--button); }
.button-text { fill: var(--button-text); font-size: 13px; font-weight: 600; }
.path { fill: none; stroke: #ef5c50; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
.cursor { fill: var(--text); stroke: var(--window); stroke-width: 1.2; stroke-linejoin: round; }
.url { fill: var(--muted); font-size: 12px; }
</style>
<rect class="window" x="240" y="20" width="628" height="494" rx="16"/>
<circle class="dot" cx="262" cy="42" r="5"/><circle class="dot" cx="279" cy="42" r="5"/><circle class="dot" cx="296" cy="42" r="5"/>
<text class="caption" x="316" y="46.5">Your Arc, signed in as you</text>
<text class="caption" x="16" y="144">Independent sessions</text>
<rect class="row" x="256" y="84" width="248" height="36" rx="9"/>
<rect class="fav" x="266" y="92" width="20" height="20" rx="5"/><text class="fav-letter" x="276" y="106.5" text-anchor="middle">G</text>
<text class="tab" x="296" y="107">Gmail</text>
<rect class="row" x="256" y="130" width="248" height="36" rx="9"/>
<rect class="fav" x="266" y="138" width="20" height="20" rx="5"/><text class="fav-letter" x="276" y="152.5" text-anchor="middle">L</text>
<text class="tab" x="296" y="153">Linear</text>
<rect class="agent-row" x="256" y="176" width="248" height="36" rx="9"/>
<use href="#pi-favicon" transform="translate(266 184) scale(.833333)"/>
<text class="tab-agent" x="296" y="199">localhost:3000</text>
<rect class="agent" x="16" y="167" width="202" height="54" rx="12"/>
<use href="#pi-favicon" x="30" y="182"/>
<text class="agent-name" x="64" y="192">pi</text>
<text class="agent-sub" x="64" y="209">its own pinned tab</text>
<path class="link" d="M218 194 C 230 194, 238 194, 250 194" marker-end="url(#arrow)"/>
<rect class="agent-row active-row" x="256" y="232" width="248" height="36" rx="9"/>
<use href="#claude-favicon" transform="translate(266 240) scale(.833333)"/>
<text class="tab-agent" x="296" y="255">localhost:3000/preview</text>
<rect class="agent" x="16" y="223" width="202" height="54" rx="12"/>
<use href="#claude-favicon" x="30" y="238"/>
<text class="agent-name" x="64" y="248">Claude Code</text>
<text class="agent-sub" x="64" y="265">session 1 · its own tab</text>
<path class="link" d="M218 250 C 230 250, 238 250, 250 250" marker-end="url(#arrow)"/>
<rect class="agent-row" x="256" y="288" width="248" height="36" rx="9"/>
<use href="#claude-favicon" transform="translate(266 296) scale(.833333)"/>
<text class="tab-agent" x="296" y="311">localhost:3000/settings</text>
<rect class="agent" x="16" y="279" width="202" height="54" rx="12"/>
<use href="#claude-favicon" x="30" y="294"/>
<text class="agent-name" x="64" y="304">Claude Code</text>
<text class="agent-sub" x="64" y="321">session 2 · its own tab</text>
<path class="link" d="M218 306 C 230 306, 238 306, 250 306" marker-end="url(#arrow)"/>
<rect class="agent-row" x="256" y="344" width="248" height="36" rx="9"/>
<use href="#claude-favicon" transform="translate(266 352) scale(.833333)"/>
<text class="tab-agent" x="296" y="367">localhost:3000/pricing</text>
<rect class="agent" x="16" y="335" width="202" height="54" rx="12"/>
<use href="#claude-favicon" x="30" y="350"/>
<text class="agent-name" x="64" y="360">Claude Code</text>
<text class="agent-sub" x="64" y="377">session 3 · its own tab</text>
<path class="link" d="M218 362 C 230 362, 238 362, 250 362" marker-end="url(#arrow)"/>
<rect class="row" x="256" y="400" width="248" height="36" rx="9"/>
<rect class="fav" x="266" y="408" width="20" height="20" rx="5"/><text class="fav-letter" x="276" y="422.5" text-anchor="middle">F</text>
<text class="tab" x="296" y="423">Figma</text>
<rect class="row" x="256" y="446" width="248" height="36" rx="9"/>
<rect class="fav" x="266" y="454" width="20" height="20" rx="5"/><text class="fav-letter" x="276" y="468.5" text-anchor="middle">D</text>
<text class="tab" x="296" y="469">Docs</text>
<text class="caption" x="16" y="426">Every session gets</text>
<text class="caption" x="16" y="445">its own pinned tab.</text>
<g clip-path="url(#page)">
<rect class="page" x="520" y="84" width="336" height="414" rx="10"/>
<rect x="520" y="84" width="336" height="18" fill="url(#glow-top)"/>
<rect x="520" y="84" width="10" height="414" fill="url(#glow-left)"/>
<rect x="846" y="84" width="10" height="414" fill="url(#glow-right)"/>
</g>
<rect x="520" y="84" width="336" height="414" rx="10" fill="none" stroke="#ef5c50" stroke-opacity=".55" stroke-width="1.5"/>
<text class="url" x="540" y="117">localhost:3000/preview</text>
<text class="page-title" x="540" y="156">Preview your app</text>
<text class="caption" x="540" y="181">Check the latest UI changes</text>
<text class="caption" x="540" y="200">in your local development app.</text>
<rect class="skel" x="540" y="224" width="296" height="110" rx="8"/>
<rect class="skel" x="540" y="352" width="224" height="9" rx="4"/>
<rect class="skel" x="540" y="370" width="268" height="9" rx="4"/>
<text class="caption" x="540" y="475">Claude Code · session 1</text>
<rect class="button" x="672" y="422" width="164" height="36" rx="8"/>
<text class="button-text" x="754" y="445.5" text-anchor="middle">Open preview</text>
<path class="path" d="M566 350 C 580 444, 640 472, 685 444"/>
<path class="cursor" d="M688 440 l0 17 l4.4 -4.2 l3.1 6.9 l2.6 -1.2 l-3 -6.7 l6 -0.2 z"/>
</svg>
